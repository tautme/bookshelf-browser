<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Random Image</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img id="pic" alt="">
  <script>
    fetch('/random-image')
      .then(r => r.json())
      .then(data => {
        if (data.filename) {
          document.getElementById('pic').src = '/images/' + data.filename;
        }
      });
  </script>
</body>
</html>
